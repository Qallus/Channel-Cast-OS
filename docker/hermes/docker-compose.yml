# Local Hermes Agent, for development against the Channel Cast dashboard.
#
# Mirrors Coolify's official hermes-agent template, with one addition that
# matters: the API server. Neither Coolify template (hermes-agent or
# hermes-agent-with-webui) sets any API_SERVER_* variable, so neither exposes
# the OpenAI-compatible endpoint this app talks to. Without the block below
# there is no /v1/chat/completions to call.
#
# The VPS agent is a SEPARATE agent with its own volume, memory, sessions and
# skills. Nothing is shared, which is what you want: experiments here never
# touch production. Never point two agent containers at one data directory.
#
#   cd docker/hermes
#   cp .env.example .env                    # fill in a provider key + API_SERVER_KEY
#   docker compose run --rm hermes setup    # first run only: writes config.yaml
#   docker compose up -d
#   npm run hermes:check -- --url http://localhost:8642
services:
  hermes:
    # Pinned deliberately. Keep this matching the tag on the VPS so local and
    # production behave the same; "latest" drifts underneath you.
    image: nousresearch/hermes-agent:v2026.9.24
    container_name: channelcast-hermes
    command: gateway run
    restart: unless-stopped
    env_file: .env
    environment:
      HERMES_HOME: /opt/data
      # The API this app calls. Absent from both Coolify templates.
      API_SERVER_ENABLED: "true"
      API_SERVER_PORT: "8642"
      # Binds to 127.0.0.1 inside the container otherwise, which nothing can
      # reach from outside it — the usual "connection refused".
      API_SERVER_HOST: "0.0.0.0"
      # Coolify's templates ship this as true. Keep it false here and there:
      # an open gateway lets any caller the agent can see use it.
      GATEWAY_ALLOW_ALL_USERS: "false"
      HERMES_REDACT_SECRETS: "true"
      HERMES_UID: "1000"
      HERMES_GID: "1000"
    ports:
      # Localhost only: this is a keyed API, not something to put on the LAN.
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API — what the app calls
      - "127.0.0.1:9119:9119"   # built-in dashboard — handy locally, never public
    volumes:
      # Lose this and the agent forgets everything on every restart.
      - hermes-home:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  hermes-home:
